name: Publish

on:
  push:
    branches:
      - master
  # Refresh crate statistics (downloads, stars) even when nothing is merged
  schedule:
    - cron: "30 23 * * 0"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    uses: anowell/are-we-learning-yet/.github/workflows/build.yml@master

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built site archive
        uses: actions/download-artifact@v8
        with:
          name: site-archive
          path: _site

      - name: _site directory exists
        run: test -d _site && ls -R _site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
