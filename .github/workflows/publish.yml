name: Publish

on:
  push:
    branches:
      - master
  # Refresh crate statistics (downloads, stars) even when nothing is merged
  schedule:
    - cron: "30 23 * * 0"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (version in the trailing comment) rather than
# to tags, which are mutable. peaceiris/actions-gh-pages is handed a token that can push to the
# published branch, so whoever controls the `v4` tag would otherwise control what the site serves.
jobs:
  build:
    uses: anowell/are-we-learning-yet/.github/workflows/build.yml@master

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built site archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-archive
          path: _site

      - name: _site directory exists
        run: test -d _site && ls -R _site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
