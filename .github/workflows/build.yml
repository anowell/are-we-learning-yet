on:
  pull_request:
    branches:
      - master
  workflow_call:

name: Build

env:
  COBALT_VERSION: v0.20.4

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Use cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: _scraper

      - name: Run cargo clippy
        run: cargo clippy --manifest-path _scraper/Cargo.toml --all-targets -- -D warnings

      - name: Run cargo fmt
        run: cargo fmt --manifest-path _scraper/Cargo.toml --all -- --check

  scraper:
    name: Site Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Use cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: _scraper

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Use daily cache of scraper data
        uses: actions/cache@v6
        with:
          path: _tmp
          key: scraper-data-cache-${{ steps.date.outputs.date }}

      - name: Run Scraper
        run: cargo run --release --manifest-path _scraper/Cargo.toml -- _data/crates.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cobalt
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cobalt-org/cobalt.rs/releases/download/${COBALT_VERSION}/cobalt-${COBALT_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" ./cobalt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Site
        run: cobalt build

      - name: Upload built site archive
        uses: actions/upload-artifact@v7
        with:
          name: site-archive
          path: _site
