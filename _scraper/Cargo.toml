[package]
name = "scraper"
version = "0.1.0"
authors = ["Anthony Nowell <anowell@gmail.com>"]
edition = "2024"
rust-version = "1.85"

[dependencies]
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
# One HTTP client for every source that is not crates.io: GitHub, Codeberg, GitLab, ecosyste.ms
# and the RustSec advisory index. Replaces octocrab, which only spoke to one of them.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "charset", "http2"] }
crates_io_api = { version = "0.12.0", default-features = false, features = ["rustls"] }
